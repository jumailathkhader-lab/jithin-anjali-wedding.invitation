<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f0e3">
  <title>Wedding Invitation</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;min-height:100%;margin:0;background:#f7f0e3}
    body{position:relative;overflow:hidden;animation:arrive .6s ease-out both}
    .video-background{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;z-index:0;background:#f7f0e3}
    @keyframes arrive{from{opacity:0}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){body{animation:none}}
  </style>
</head>
<body>
  <video class="video-background" autoplay muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
    <source src="wedding-background.mp4" type="video/mp4">
  </video>
</body>
</html>
